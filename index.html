<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux Dev Tools Hub</title>
  <style>
    :root { 
      --bg: #0d1117; 
      --card: #161b22; 
      --border: #30363d; 
      --text: #c9d1d9; 
      --accent: #238636; 
      --danger: #da3633; 
    }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      max-width: 680px; 
      margin: 40px auto; 
      padding: 0 16px; 
      background: var(--bg); 
      color: var(--text); 
      line-height: 1.5;
    }
    header { 
      border-bottom: 1px solid var(--border); 
      padding-bottom: 16px; 
    }
    button { 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 8px 14px; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
    }
    .card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      padding: 16px; 
      margin-top: 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .vote-btn { 
      background: #21262d; 
      border: 1px solid var(--border); 
      color: #58a6ff; 
      min-width: 54px; 
      padding: 6px 10px;
      text-align: center; 
    }
    input { 
      background: var(--card); 
      border: 1px solid var(--border); 
      color: #fff; 
      padding: 10px; 
      border-radius: 6px; 
      width: 100%; 
      box-sizing: border-box;
      margin-bottom: 10px; 
    }
    form { 
      background: var(--card); 
      border: 1px solid var(--border); 
      padding: 16px; 
      border-radius: 6px; 
      margin-top: 16px; 
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <h2 style="margin: 0;">🛠️ Linux Tools Showcase</h2>
  </header>

  <!-- Submission Form -->
  <form id="pkg-form" onsubmit="submitPackage(event)">
    <h3 style="margin-top:0">Submit a Package / Utility</h3>
    <input type="text" id="title" placeholder="Package Name (e.g. custom-uname)" required />
    <input type="text" id="desc" placeholder="Short Description" required />
    <input type="url" id="url" placeholder="Repository / Package URL" required />
    <input type="text" id="author" placeholder="Your Name / Handle" required />
    <button type="submit">Submit</button>
  </form>

  <div id="package-list" style="margin-top: 24px;">Loading packages...</div>

  <script>
    const SUPABASE_URL = 'https://bdehlwonhpafijrqsels.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yJf1BHTZL8RObCfTIP45ew_6dhUrAg2';
    
    window.supabase = window.supabase || supabasejs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const supabase = window.supabase;

    async function loadPackages() {
      const { data: pkgs, error } = await supabase
        .from('packages')
        .select('*, upvotes(count)')
        .order('created_at', { ascending: false });

      const list = document.getElementById('package-list');

      if (error) { 
        list.innerHTML = `<p style="color:var(--danger)">Failed to load: ${error.message}</p>`; 
        return; 
      }

      if (!pkgs || pkgs.length === 0) {
        list.innerHTML = '<p>No packages submitted yet.</p>';
        return;
      }

      list.innerHTML = pkgs.map(p => `
        <div class="card">
          <div>
            <h4 style="margin:0">
              <a href="${escapeHtml(p.repo_url)}" target="_blank" style="color:#58a6ff; text-decoration:none;">${escapeHtml(p.title)}</a>
            </h4>
            <p style="margin:4px 0; font-size:14px;">${escapeHtml(p.description)}</p>
            <small style="color:#8b949e">Submitted by @${escapeHtml(p.submitted_by || 'anonymous')}</small>
          </div>
          <button class="vote-btn" onclick="upvote('${p.id}')">▲ ${p.upvotes[0]?.count || 0}</button>
        </div>
      `).join('');
    }

    async function submitPackage(e) {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const description = document.getElementById('desc').value;
      const repo_url = document.getElementById('url').value;
      const submitted_by = document.getElementById('author').value;

      const { error } = await supabase.from('packages').insert([{
        title, 
        description, 
        repo_url,
        submitted_by
      }]);

      if (error) {
        alert('Error submitting: ' + error.message);
      } else { 
        e.target.reset(); 
        loadPackages(); 
      }
    }

    async function upvote(pkgId) {
      const { error } = await supabase.from('upvotes').insert([{ 
        package_id: pkgId 
      }]);

      if (error) {
        console.error('Error upvoting:', error.message);
      }
      
      loadPackages();
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    loadPackages();
  </script>
</body>
</html>
