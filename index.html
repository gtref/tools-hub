<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Linux Dev Tools Hub</title>

  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --danger: #da3633;
      --link: #58a6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 16px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    header h2 {
      margin: 0;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary-btn {
      background: #30363d;
    }

    .secondary-btn:hover {
      background: #3d444d;
    }

    .delete-btn {
      background: var(--danger);
      padding: 4px 8px;
      margin-left: 8px;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: #f85149;
    }

    .auth-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .auth-user {
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      background: #8957e5;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .package-info {
      min-width: 0;
      flex: 1;
    }

    .package-title {
      margin: 0;
      word-break: break-word;
    }

    .package-title a {
      color: var(--link);
      text-decoration: none;
    }

    .package-title a:hover {
      text-decoration: underline;
    }

    .package-description {
      margin: 4px 0;
      font-size: 14px;
    }

    .package-author {
      color: var(--muted);
      font-size: 13px;
    }

    .vote-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--link);
      min-width: 64px;
      padding: 7px 10px;
      text-align: center;
      flex-shrink: 0;
    }

    .vote-btn:hover {
      background: #30363d;
    }

    input {
      background: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      margin-bottom: 10px;
    }

    input:focus {
      outline: none;
      border-color: var(--link);
    }

    form {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 6px;
      margin-top: 16px;
    }

    form h3 {
      margin-top: 0;
    }

    .hidden {
      display: none !important;
    }

    .message {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-top: 16px;
    }

    .error {
      color: var(--danger);
    }

    .success {
      color: #3fb950;
    }

    .loading {
      color: var(--muted);
    }

    .login-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 500px) {
      body {
        margin-top: 20px;
      }

      .card {
        align-items: flex-start;
      }

      .vote-btn {
        min-width: 58px;
      }
    }
  </style>

  <!-- Supabase JavaScript client -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

  <header>
    <h2>🛠️ Linux Tools Showcase</h2>
  </header>

  <!-- Authentication -->

  <div id="auth-section" class="auth-section">
    <div class="login-area">
      <span>Sign in to submit and vote on packages.</span>
      <button type="button" onclick="loginGitHub()">
        Login with GitHub
      </button>
    </div>
  </div>

  <!-- Submission Form -->

  <form id="pkg-form" class="hidden" onsubmit="submitPackage(event)">
    <h3>Submit a Package / Utility</h3>

```
<input
  type="text"
  id="title"
  placeholder="Package Name (e.g. custom-uname)"
  required
  maxlength="100"
>

<input
  type="text"
  id="desc"
  placeholder="Short Description"
  required
  maxlength="500"
>

<input
  type="url"
  id="url"
  placeholder="Repository / Package URL"
  required
>

<input
  type="text"
  id="author"
  placeholder="Your Name / Handle"
  required
  maxlength="100"
>

<button type="submit" id="submit-btn">
  Submit
</button>

<div id="submit-message"></div>
```

  </form>

  <!-- Package List -->

  <div id="package-list" style="margin-top: 24px;">
    <p class="loading">Loading packages...</p>
  </div>

  <script>
    /*
     * ============================================================
     * SUPABASE CONFIGURATION
     * ============================================================
     *
     * The CDN creates window.supabase.
     *
     * We DO NOT declare:
     *
     *     const supabase = ...
     *
     * because that can collide with the global Supabase object.
     *
     * Instead we use supabaseClient for our actual client.
     */

    const SUPABASE_URL =
      'https://bdehlwonhpafijrqsels.supabase.co';

    const SUPABASE_ANON_KEY =
      'sb_publishable_yJf1BHTZL8RObCfTIP45ew_6dhUrAg2';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    let currentUser = null;
    let isAdmin = false;


    /*
     * ============================================================
     * INITIALIZATION
     * ============================================================
     */

    async function init() {
      try {
        const {
          data: { user },
          error
        } = await supabaseClient.auth.getUser();

        if (error) {
          console.error('Authentication error:', error);
        }

        currentUser = user || null;

        if (currentUser) {
          await setupLoggedInUser();
        } else {
          setupLoggedOutUser();
        }

        await loadPackages();

      } catch (error) {
        console.error('Initialization failed:', error);

        document.getElementById('package-list').innerHTML = `
          <div class="message error">
            Failed to initialize the application:
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }


    /*
     * ============================================================
     * LOGGED-IN USER
     * ============================================================
     */

    async function setupLoggedInUser() {
      const authSection = document.getElementById('auth-section');
      const pkgForm = document.getElementById('pkg-form');
      const authorInput = document.getElementById('author');

      const metadata = currentUser.user_metadata || {};

      const username =
        metadata.user_name ||
        metadata.preferred_username ||
        metadata.name ||
        currentUser.email?.split('@')[0] ||
        'user';

      /*
       * Check admin role.
       */
      try {
        const { data: role, error } = await supabaseClient
          .from('user_roles')
          .select('is_admin')
          .eq('id', currentUser.id)
          .maybeSingle();

        if (error) {
          console.warn('Could not check admin role:', error.message);
        }

        if (role && role.is_admin === true) {
          isAdmin = true;
        }
      } catch (error) {
        console.warn('Admin check failed:', error);
      }

      authSection.innerHTML = `
        <div class="auth-user">
          @${escapeHtml(username)}
          ${isAdmin ? '<span class="badge">ADMIN</span>' : ''}
        </div>

        <button
          type="button"
          class="secondary-btn"
          onclick="logout()"
        >
          Logout
        </button>
      `;

      /*
       * Show submission form.
       */
      pkgForm.classList.remove('hidden');

      /*
       * Automatically fill the author field with the
       * GitHub username, but still allow the user to edit it.
       */
      authorInput.value = username;
    }


    /*
     * ============================================================
     * LOGGED-OUT USER
     * ============================================================
     */

    function setupLoggedOutUser() {
      const authSection = document.getElementById('auth-section');
      const pkgForm = document.getElementById('pkg-form');

      pkgForm.classList.add('hidden');

      authSection.innerHTML = `
        <div class="login-area">
          <span>Sign in to submit and vote on packages.</span>

          <button
            type="button"
            onclick="loginGitHub()"
          >
            Login with GitHub
          </button>
        </div>
      `;
    }


    /*
     * ============================================================
     * GITHUB LOGIN
     * ============================================================
     */

    async function loginGitHub() {
      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'github',
          options: {
            redirectTo: window.location.origin
          }
        });

        if (error) {
          alert('Login failed: ' + error.message);
        }

      } catch (error) {
        console.error('GitHub login error:', error);
        alert('Login failed: ' + error.message);
      }
    }


    /*
     * ============================================================
     * LOGOUT
     * ============================================================
     */

    async function logout() {
      try {
        const { error } = await supabaseClient.auth.signOut();

        if (error) {
          alert('Logout failed: ' + error.message);
          return;
        }

        window.location.reload();

      } catch (error) {
        console.error('Logout error:', error);
        alert('Logout failed: ' + error.message);
      }
    }


    /*
     * ============================================================
     * LOAD PACKAGES
     * ============================================================
     */

    async function loadPackages() {
      const list = document.getElementById('package-list');

      list.innerHTML = '<p class="loading">Loading packages...</p>';

      try {
        const {
          data: pkgs,
          error
        } = await supabaseClient
          .from('packages')
          .select(`
            *,
            upvotes(count)
          `)
          .order('created_at', {
            ascending: false
          });

        if (error) {
          console.error('Package loading error:', error);

          list.innerHTML = `
            <div class="message error">
              Failed to load packages:
              ${escapeHtml(error.message)}
            </div>
          `;

          return;
        }

        if (!pkgs || pkgs.length === 0) {
          list.innerHTML = `
            <div class="message">
              No packages submitted yet.
            </div>
          `;

          return;
        }

        list.innerHTML = pkgs.map(packageItem => {
          const upvoteCount =
            packageItem.upvotes?.[0]?.count || 0;

          const author =
            packageItem.submitted_by || 'anonymous';

          const deleteButton = isAdmin
            ? `
              <button
                class="delete-btn"
                onclick="deletePackage('${escapeJs(packageItem.id)}')"
              >
                Delete
              </button>
            `
            : '';

          return `
            <div class="card">

              <div class="package-info">

                <h4 class="package-title">

                  <a
                    href="${escapeHtml(packageItem.repo_url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${escapeHtml(packageItem.title)}
                  </a>

                  ${deleteButton}

                </h4>

                <p class="package-description">
                  ${escapeHtml(packageItem.description)}
                </p>

                <small class="package-author">
                  Submitted by @${escapeHtml(author)}
                </small>

              </div>

              <button
                class="vote-btn"
                onclick="upvote('${escapeJs(packageItem.id)}')"
                title="Upvote this package"
              >
                ▲ ${upvoteCount}
              </button>

            </div>
          `;
        }).join('');

      } catch (error) {
        console.error('Unexpected package error:', error);

        list.innerHTML = `
          <div class="message error">
            An unexpected error occurred while loading packages.
          </div>
        `;
      }
    }


    /*
     * ============================================================
     * SUBMIT PACKAGE
     * ============================================================
     */

    async function submitPackage(event) {
      event.preventDefault();

      if (!currentUser) {
        alert('Please log in with GitHub first.');
        return;
      }

      const title =
        document.getElementById('title').value.trim();

      const description =
        document.getElementById('desc').value.trim();

      const repo_url =
        document.getElementById('url').value.trim();

      const author =
        document.getElementById('author').value.trim();

      const submitButton =
        document.getElementById('submit-btn');

      const message =
        document.getElementById('submit-message');


      if (!title || !description || !repo_url || !author) {
        message.innerHTML = `
          <p class="error">
            Please fill in all fields.
          </p>
        `;

        return;
      }


      submitButton.disabled = true;
      submitButton.textContent = 'Submitting...';

      message.innerHTML = '';


      try {
        const { error } = await supabaseClient
          .from('packages')
          .insert([{
            title: title,
            description: description,
            repo_url: repo_url,
            submitted_by: author,
            user_id: currentUser.id
          }]);


        if (error) {
          console.error('Submission error:', error);

          message.innerHTML = `
            <p class="error">
              Error submitting package:
              ${escapeHtml(error.message)}
            </p>
          `;

          return;
        }


        event.target.reset();

        /*
         * Restore the author's username after reset.
         */
        const metadata = currentUser.user_metadata || {};

        const username =
          metadata.user_name ||
          metadata.preferred_username ||
          metadata.name ||
          currentUser.email?.split('@')[0] ||
          'user';

        document.getElementById('author').value = username;


        message.innerHTML = `
          <p class="success">
            Package submitted successfully!
          </p>
        `;


        await loadPackages();


      } catch (error) {
        console.error('Unexpected submission error:', error);

        message.innerHTML = `
          <p class="error">
            Unexpected error:
            ${escapeHtml(error.message)}
          </p>
        `;

      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Submit';
      }
    }


    /*
     * ============================================================
     * UPVOTE
     * ============================================================
     */

    async function upvote(packageId) {
      if (!currentUser) {
        alert('Please log in with GitHub to upvote packages!');
        return;
      }

      try {
        const { error } = await supabaseClient
          .from('upvotes')
          .insert([{
            package_id: packageId,
            user_id: currentUser.id
          }]);


        /*
         * PostgreSQL 23505 = unique constraint violation.
         *
         * If the user already voted, remove their vote.
         * This makes the button act as a toggle.
         */
        if (error) {

          if (error.code === '23505') {

            const { error: deleteError } =
              await supabaseClient
                .from('upvotes')
                .delete()
                .eq('package_id', packageId)
                .eq('user_id', currentUser.id);

            if (deleteError) {
              console.error(
                'Could not remove upvote:',
                deleteError
              );

              alert(
                'Could not toggle vote: ' +
                deleteError.message
              );

              return;
            }

          } else {
            console.error('Upvote error:', error);

            alert(
              'Could not vote: ' +
              error.message
            );

            return;
          }
        }

        await loadPackages();

      } catch (error) {
        console.error('Unexpected upvote error:', error);

        alert(
          'Could not update vote: ' +
          error.message
        );
      }
    }


    /*
     * ============================================================
     * DELETE PACKAGE
     * ============================================================
     */

    async function deletePackage(packageId) {

      if (!isAdmin) {
        alert('You do not have permission to delete packages.');
        return;
      }


      if (!confirm(
        'Are you sure you want to delete this package?'
      )) {
        return;
      }


      try {
        const { error } = await supabaseClient
          .from('packages')
          .delete()
          .eq('id', packageId);


        if (error) {
          console.error('Delete error:', error);

          alert(
            'Error deleting package: ' +
            error.message
          );

          return;
        }


        await loadPackages();

      } catch (error) {
        console.error(
          'Unexpected delete error:',
          error
        );

        alert(
          'Could not delete package: ' +
          error.message
        );
      }
    }


    /*
     * ============================================================
     * HTML ESCAPING
     * ============================================================
     */

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    /*
     * Escape values placed inside JavaScript strings
     * in dynamically generated HTML.
     */

    function escapeJs(value) {
      return String(value ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'");
    }


    /*
     * ============================================================
     * START APPLICATION
     * ============================================================
     */

    init();
  </script>

</body>
</html>
